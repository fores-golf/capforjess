name: Capital One Event Scraper

on:
  schedule:
    # Runs every 30 minutes. 
    # If you made the repo public, you can change this to '*/10 * * * *' for 10 minutes.
    - cron: '*/5 * * * *' 
  workflow_dispatch: # This line adds a button in GitHub so you can run it manually anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest # Using Ubuntu keeps your action minutes low

    steps:
      # 1. Grab the code from your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up a Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install the required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the script and pass in the hidden secrets
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python caponeexc.py